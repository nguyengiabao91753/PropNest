<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 550" width="1000" height="550" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F8624" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD344C" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900" />
    </marker>
    
    <!-- Drop shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1000" height="550" fill="#FFFFFF" />
  
  <rect x="0" y="0" width="1000" height="50" fill="#232F3E" />
  <text x="500" y="32" font-size="20" font-weight="bold" fill="#FFFFFF" text-anchor="middle">NGUYÊN LÝ HOẠT ĐỘNG VÀ QUY TRÌNH TÁI TẠO CỦA HISTORY DELTA ENGINE</text>

  <!-- SECTION A -->
  <rect x="40" y="70" width="920" height="220" rx="8" ry="8" fill="#F8F9F9" stroke="#1A8C8C" stroke-width="2" />
  <rect x="40" y="70" width="920" height="35" rx="8" ry="8" fill="#1A8C8C" />
  <rect x="40" y="90" width="920" height="15" fill="#1A8C8C" />
  <text x="500" y="94" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">A. QUY TRÌNH LƯU TRỮ VI SAI (STORAGE PIPELINE)</text>

  <!-- Step A1 -->
  <rect x="60" y="130" width="250" height="130" rx="8" ry="8" fill="#FFFFFF" stroke="#3F8624" stroke-width="2" filter="url(#drop-shadow)" />
  <rect x="60" y="130" width="250" height="35" rx="8" ry="8" fill="#3F8624" />
  <rect x="60" y="150" width="250" height="15" fill="#3F8624" />
  <text x="185" y="153" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Step A1: Tạo tin (T0)</text>
  <text x="185" y="185" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Full Snapshot Json</text>
  <text x="185" y="205" font-size="13" fill="#666666" text-anchor="middle">(IsSnapshot = True)</text>
  <text x="185" y="235" font-size="12" fill="#232F3E" text-anchor="middle" font-family="monospace">{title: 'Nhà Q1', price: 3.0, area: 60}</text>

  <!-- Arrow A1 to A2 -->
  <line x1="310" y1="195" x2="360" y2="195" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step A2 -->
  <rect x="375" y="130" width="250" height="130" rx="8" ry="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#drop-shadow)" />
  <rect x="375" y="130" width="250" height="35" rx="8" ry="8" fill="#FF9900" />
  <rect x="375" y="150" width="250" height="15" fill="#FF9900" />
  <text x="500" y="153" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Step A2: Sửa giá (T1)</text>
  <text x="500" y="185" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Delta Diff Json</text>
  <text x="500" y="205" font-size="13" fill="#666666" text-anchor="middle">(IsSnapshot = False)</text>
  <text x="500" y="235" font-size="12" fill="#232F3E" text-anchor="middle" font-family="monospace">[{field: 'price', old: 3.0, new: 3.2}]</text>

  <!-- Arrow A2 to A3 -->
  <line x1="625" y1="195" x2="675" y2="195" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step A3 -->
  <rect x="690" y="130" width="250" height="130" rx="8" ry="8" fill="#FFFFFF" stroke="#FF9900" stroke-width="2" filter="url(#drop-shadow)" />
  <rect x="690" y="130" width="250" height="35" rx="8" ry="8" fill="#FF9900" />
  <rect x="690" y="150" width="250" height="15" fill="#FF9900" />
  <text x="815" y="153" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Step A3: Sửa tiêu đề (T2)</text>
  <text x="815" y="185" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Delta Diff Json</text>
  <text x="815" y="205" font-size="13" fill="#666666" text-anchor="middle">(IsSnapshot = False)</text>
  <text x="815" y="235" font-size="11" fill="#232F3E" text-anchor="middle" font-family="monospace">[{field: 'title', new: 'Nhà Q1 hẻm...'}]</text>


  <!-- SECTION B -->
  <rect x="40" y="310" width="920" height="200" rx="8" ry="8" fill="#F4ECF7" stroke="#8C4FFF" stroke-width="2" />
  <rect x="40" y="310" width="920" height="35" rx="8" ry="8" fill="#8C4FFF" />
  <rect x="40" y="330" width="920" height="15" fill="#8C4FFF" />
  <text x="500" y="334" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">B. QUY TRÌNH TÁI TẠO TRẠNG THÁI TẠI THỜI ĐIỂM T2 (REPLAY ENGINE)</text>

  <!-- Step B1 -->
  <rect x="60" y="370" width="250" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="185" y="405" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Step B1</text>
  <text x="185" y="440" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Nạp Snapshot T0</text>
  <text x="185" y="460" font-size="13" fill="#666666" text-anchor="middle">(Tìm snapshot gần nhất trước mốc T2)</text>

  <!-- Arrow B1 to B2 -->
  <line x1="310" y1="430" x2="360" y2="430" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step B2 -->
  <rect x="375" y="370" width="250" height="120" rx="8" ry="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="500" y="405" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Step B2</text>
  <text x="500" y="440" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Quét tuần tự Delta</text>
  <text x="500" y="460" font-size="13" fill="#666666" text-anchor="middle">Áp dụng Delta T1 Giá: 3.2</text>
  <text x="500" y="480" font-size="13" fill="#666666" text-anchor="middle">Áp dụng Delta T2 Tiêu đề</text>

  <!-- Arrow B2 to B3 -->
  <line x1="625" y1="430" x2="675" y2="430" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step B3 -->
  <rect x="690" y="370" width="250" height="120" rx="8" ry="8" fill="#EAFAF1" stroke="#3F8624" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="815" y="405" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Step B3</text>
  <text x="815" y="435" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">Trạng thái tái tạo T2</text>
  <text x="815" y="455" font-size="13" fill="#3F8624" font-weight="bold" text-anchor="middle">Listing hoàn chỉnh tại T2</text>
  <text x="815" y="475" font-size="13" fill="#3F8624" font-weight="bold" text-anchor="middle">Độ trễ: &lt;2.0 ms</text>
  <text x="815" y="495" font-size="13" fill="#3F8624" font-weight="bold" text-anchor="middle">Tiết kiệm 78.4% dung lượng</text>

</svg>
