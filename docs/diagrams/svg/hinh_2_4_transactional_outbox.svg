<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 550" width="1100" height="550" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <!-- Arrowhead markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#232F3E" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3F8624" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#DD344C" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FF9900" />
    </marker>
    
    <!-- Drop shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="550" fill="#FFFFFF" />
  
  <!-- Title Header -->
  <rect x="0" y="0" width="1100" height="50" fill="#232F3E" />
  <text x="550" y="32" font-size="22" font-weight="bold" fill="#FFFFFF" text-anchor="middle">MÔ HÌNH TRANSACTIONAL OUTBOX PATTERN VÀ INBOX DEDUPLICATION</text>

  <!-- Left Section: PUBLISHER -->
  <rect x="40" y="80" width="340" height="440" rx="8" ry="8" fill="#F2F3F4" stroke="#232F3E" stroke-width="2" />
  <rect x="40" y="80" width="340" height="40" rx="8" ry="8" fill="#232F3E" />
  <!-- To cover bottom corners of header -->
  <rect x="40" y="100" width="340" height="20" fill="#232F3E" />
  <text x="210" y="106" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">PROPNEST.API (PUBLISHER)</text>
  
  <!-- Thực thi nghiệp vụ -->
  <rect x="60" y="140" width="300" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#EC7211" stroke-width="2" filter="url(#drop-shadow)" />
  <text x="210" y="165" font-size="16" font-weight="bold" fill="#232F3E" text-anchor="middle">Thực thi nghiệp vụ</text>
  <text x="210" y="185" font-size="14" fill="#666666" text-anchor="middle">(Tạo tin / Mua gói / Nạp ví)</text>

  <!-- Arrow Down -->
  <line x1="210" y1="200" x2="210" y2="245" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />
  <text x="220" y="225" font-size="12" fill="#3F8624" font-weight="bold">Ghi đồng thời trong 1 Transaction</text>

  <!-- Database SQL Server -->
  <rect x="60" y="250" width="300" height="250" rx="8" ry="8" fill="#FFFFFF" stroke="#1A8C8C" stroke-width="2" />
  <rect x="60" y="250" width="300" height="35" rx="8" ry="8" fill="#1A8C8C" />
  <rect x="60" y="270" width="300" height="15" fill="#1A8C8C" />
  <text x="210" y="273" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CƠ SỞ DỮ LIỆU SQL SERVER</text>
  <text x="210" y="305" font-size="14" fill="#DD344C" font-weight="bold" text-anchor="middle">[Atomic Transaction (ACID)]</text>
  
  <!-- Listings / Wallets -->
  <rect x="80" y="320" width="260" height="50" rx="6" ry="6" fill="#F8F9F9" stroke="#CCCCCC" stroke-width="1" />
  <circle cx="100" cy="345" r="5" fill="#3F8624" />
  <text x="115" y="340" font-size="14" font-weight="bold" fill="#232F3E">Bảng nghiệp vụ</text>
  <text x="115" y="360" font-size="13" fill="#666666">Listings / Wallets</text>

  <!-- OutboxMessages -->
  <rect x="80" y="390" width="260" height="90" rx="6" ry="6" fill="#FDFEFE" stroke="#FF9900" stroke-width="2" filter="url(#drop-shadow)" />
  <circle cx="100" cy="415" r="5" fill="#FF9900" />
  <text x="115" y="410" font-size="14" font-weight="bold" fill="#232F3E">Bảng OutboxMessages</text>
  <text x="115" y="430" font-size="13" fill="#666666">- Payload JSON</text>
  <text x="115" y="450" font-size="13" fill="#666666">- EventType</text>

  <!-- Middle: Dispatcher -->
  <rect x="420" y="200" width="260" height="250" rx="8" ry="8" fill="#FDF2E9" stroke="#EC7211" stroke-width="2" filter="url(#drop-shadow)" />
  <rect x="420" y="200" width="260" height="40" rx="8" ry="8" fill="#EC7211" />
  <rect x="420" y="220" width="260" height="20" fill="#EC7211" />
  <text x="550" y="226" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">Outbox Dispatcher</text>
  
  <text x="550" y="260" font-size="14" font-weight="bold" fill="#232F3E" text-anchor="middle">(Background Service)</text>
  
  <circle cx="445" cy="290" r="15" fill="#FFFFFF" stroke="#EC7211" stroke-width="2" />
  <text x="445" y="295" font-size="14" font-weight="bold" fill="#EC7211" text-anchor="middle">1</text>
  <text x="470" y="295" font-size="14" fill="#232F3E">Quét bản ghi chưa gửi</text>
  
  <circle cx="445" cy="340" r="15" fill="#FFFFFF" stroke="#EC7211" stroke-width="2" />
  <text x="445" y="345" font-size="14" font-weight="bold" fill="#EC7211" text-anchor="middle">2</text>
  <text x="470" y="345" font-size="14" fill="#232F3E">Dispatch sang Broker</text>
  
  <circle cx="445" cy="390" r="15" fill="#FFFFFF" stroke="#EC7211" stroke-width="2" />
  <text x="445" y="395" font-size="14" font-weight="bold" fill="#EC7211" text-anchor="middle">3</text>
  <text x="470" y="395" font-size="14" fill="#232F3E">Đánh dấu ProcessedOn</text>

  <!-- Arrows Publisher to Dispatcher -->
  <line x1="340" y1="435" x2="410" y2="350" stroke="#EC7211" stroke-width="2" stroke-dasharray="5,5" marker-end="url(#arrow-orange)" />

  <!-- Broker -->
  <rect x="730" y="160" width="220" height="90" rx="8" ry="8" fill="#FFFFFF" stroke="#8C4FFF" stroke-width="2" filter="url(#drop-shadow)" />
  <rect x="730" y="160" width="220" height="30" rx="8" ry="8" fill="#8C4FFF" />
  <rect x="730" y="175" width="220" height="15" fill="#8C4FFF" />
  <text x="840" y="180" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">RabbitMQ (AMQP Broker)</text>
  <rect x="750" y="200" width="180" height="35" rx="4" ry="4" fill="#F4ECF7" stroke="#8C4FFF" stroke-dasharray="4,2" />
  <text x="840" y="222" font-size="14" font-weight="bold" fill="#8C4FFF" text-anchor="middle">Queue Messages (Persistent)</text>

  <!-- Arrow Dispatcher to Broker -->
  <line x1="680" y1="240" x2="720" y2="220" stroke="#8C4FFF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Right Section: CONSUMER -->
  <rect x="730" y="290" width="330" height="230" rx="8" ry="8" fill="#F2F3F4" stroke="#232F3E" stroke-width="2" />
  <rect x="730" y="290" width="330" height="40" rx="8" ry="8" fill="#232F3E" />
  <rect x="730" y="310" width="330" height="20" fill="#232F3E" />
  <text x="895" y="316" font-size="16" font-weight="bold" fill="#FFFFFF" text-anchor="middle">CONSUMER</text>
  
  <rect x="750" y="340" width="290" height="50" rx="8" ry="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2" />
  <text x="895" y="370" font-size="16" font-weight="bold" fill="#232F3E" text-anchor="middle">Event Handler (Saga / Worker)</text>

  <!-- Arrow Broker to Consumer -->
  <line x1="840" y1="250" x2="840" y2="330" stroke="#8C4FFF" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Arrow Handler to Inbox -->
  <line x1="895" y1="390" x2="895" y2="430" stroke="#232F3E" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="750" y="440" width="290" height="70" rx="6" ry="6" fill="#EAFAF1" stroke="#3F8624" stroke-width="2" filter="url(#drop-shadow)" />
  <circle cx="770" cy="460" r="5" fill="#3F8624" />
  <text x="785" y="465" font-size="14" font-weight="bold" fill="#232F3E">Bảng Inbox</text>
  <text x="785" y="485" font-size="13" fill="#666666">(MessageId, ConsumerId)</text>
  <text x="785" y="505" font-size="13" fill="#DD344C" font-weight="bold">[Chống lặp Deduplication]</text>

</svg>
