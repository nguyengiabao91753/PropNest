<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <!-- Definitions -->
  <defs>
    <style>
      .bg { fill: #FAFAFA; }
      .header-rect { fill: #232F3E; rx: 8; ry: 8; }
      .header-text { fill: #FFFFFF; font-family: 'Arial, Helvetica, sans-serif'; font-size: 18px; font-weight: bold; }
      .axis { stroke: #545B64; stroke-width: 2; }
      .grid { stroke: #D5DBDB; stroke-width: 1; stroke-dasharray: 4,4; }
      .tick-text { fill: #545B64; font-family: 'Arial, Helvetica, sans-serif'; font-size: 12px; }
      .axis-label { fill: #232F3E; font-family: 'Arial, Helvetica, sans-serif'; font-size: 14px; font-weight: bold; }
      .line-full { stroke: #DD344C; stroke-width: 3; stroke-dasharray: 6,4; fill: none; }
      .line-delta { stroke: #3F8624; stroke-width: 3; fill: none; }
      .area-savings { fill: #3F8624; fill-opacity: 0.15; }
      .legend-text { fill: #333333; font-family: 'Arial, Helvetica, sans-serif'; font-size: 12px; }
      .data-label { fill: #232F3E; font-family: 'Arial, Helvetica, sans-serif'; font-size: 12px; font-weight: bold; }
    </style>
    <filter id="shadow8" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" class="bg"/>

  <!-- Title Header -->
  <rect x="20" y="20" width="760" height="50" class="header-rect" filter="url(#shadow8)"/>
  <text x="400" y="52" class="header-text" text-anchor="middle">So sánh dung lượng lưu trữ CSDL qua 50 lần chỉnh sửa liên tiếp (100 tin)</text>

  <!-- Chart Area -->
  <g transform="translate(80, 120)">
    <!-- Grid Lines (Y-axis 0 to 200, step 40) -->
    <line x1="0" y1="0" x2="650" y2="0" class="grid"/>
    <line x1="0" y1="60" x2="650" y2="60" class="grid"/>
    <line x1="0" y1="120" x2="650" y2="120" class="grid"/>
    <line x1="0" y1="180" x2="650" y2="180" class="grid"/>
    <line x1="0" y1="240" x2="650" y2="240" class="grid"/>
    <line x1="0" y1="300" x2="650" y2="300" class="grid"/>

    <!-- Y Axis Ticks -->
    <text x="-10" y="5" class="tick-text" text-anchor="end">200</text>
    <text x="-10" y="65" class="tick-text" text-anchor="end">160</text>
    <text x="-10" y="125" class="tick-text" text-anchor="end">120</text>
    <text x="-10" y="185" class="tick-text" text-anchor="end">80</text>
    <text x="-10" y="245" class="tick-text" text-anchor="end">40</text>
    <text x="-10" y="305" class="tick-text" text-anchor="end">0</text>

    <!-- X Axis Ticks (1 to 50, step 10) -->
    <text x="0" y="320" class="tick-text" text-anchor="middle">1</text>
    <text x="130" y="320" class="tick-text" text-anchor="middle">10</text>
    <text x="260" y="320" class="tick-text" text-anchor="middle">20</text>
    <text x="390" y="320" class="tick-text" text-anchor="middle">30</text>
    <text x="520" y="320" class="tick-text" text-anchor="middle">40</text>
    <text x="650" y="320" class="tick-text" text-anchor="middle">50</text>

    <!-- Axes -->
    <line x1="0" y1="0" x2="0" y2="300" class="axis"/>
    <line x1="0" y1="300" x2="650" y2="300" class="axis"/>

    <!-- Axis Labels -->
    <text x="-40" y="150" class="axis-label" transform="rotate(-90, -40, 150)" text-anchor="middle">Tổng dung lượng lưu trữ CSDL (Kilobytes)</text>
    <text x="325" y="350" class="axis-label" text-anchor="middle">Số lần chỉnh sửa nội dung tin đăng</text>

    <!-- Data: 
      Full: (1, 3.84) to (50, 192.0)
      Delta: (1, 3.84) to (50, 19.52)
      Scale Y: 300 pixels = 200 KB -&amp;gt; 1 KB = 1.5 pixels
      Scale X: 650 pixels = 49 units (from 1 to 50) -&amp;gt; 1 unit = 650/49 = 13.26 pixels
    -->
    
    <!-- Savings Area -->
    <polygon points="0,294.24 650,12 650,270.72" class="area-savings"/>

    <!-- Lines -->
    <line x1="0" y1="294.24" x2="650" y2="12" class="line-full"/>
    <line x1="0" y1="294.24" x2="650" y2="270.72" class="line-delta"/>

    <!-- Data Points &amp; Labels at edit 50 -->
    <circle cx="650" cy="12" r="5" fill="#DD344C"/>
    <text x="640" y="8" class="data-label" text-anchor="end" fill="#DD344C">192.0 KB</text>

    <circle cx="650" cy="270.72" r="5" fill="#3F8624"/>
    <text x="640" y="285" class="data-label" text-anchor="end" fill="#3F8624">19.52 KB</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 420)">
    <rect width="600" height="60" fill="#FFFFFF" stroke="#D5DBDB" rx="5" ry="5"/>
    
    <line x1="20" y1="20" x2="50" y2="20" class="line-full"/>
    <text x="60" y="24" class="legend-text">Phương pháp Full Snapshot truyền thống (3.84 KB/lần)</text>
    
    <line x1="20" y1="40" x2="50" y2="40" class="line-delta"/>
    <text x="60" y="44" class="legend-text">Động cơ History Delta Engine đề xuất (0.32 KB/lần)</text>

    <rect x="360" y="25" width="20" height="10" class="area-savings"/>
    <text x="390" y="34" class="legend-text">Dung lượng CSDL tiết kiệm (78.4%)</text>
  </g>

</svg>
