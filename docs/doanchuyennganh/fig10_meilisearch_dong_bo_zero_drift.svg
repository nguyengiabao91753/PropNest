<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="700" viewBox="0 0 1360 700" role="img" aria-label="Cơ chế 5 lớp chống lệch dữ liệu và ánh xạ đồng bộ Meilisearch">
  <defs>
    <style>
      .sans { font-family: Segoe UI, Arial, Helvetica, sans-serif; }
      .math { font-family: Cambria Math, Georgia, Times New Roman, serif; font-style: italic; }
    </style>
    <marker id="ah-ink" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#111827"/>
    </marker>
    <marker id="ah-open" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5" fill="none" stroke="#111827" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="ah-red" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#DC5656"/>
    </marker>
    <marker id="ah-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#54B56C"/>
    </marker>
    <marker id="ah-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#4AA3D8"/>
    </marker>
    <marker id="ah-orange" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#F27D32"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1360" height="700" fill="#FFFFFF"/>
  <rect x="28.0" y="36.0" width="614.0" height="628.0" rx="10" fill="#FAFCFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <rect x="44.0" y="24.0" width="383.9" height="24" rx="4" fill="#FFFFFF" stroke="#4AA3D8" stroke-width="1.6"/>
  <text x="236.0" y="40.5" text-anchor="middle" fill="#4AA3D8" font-size="12" font-weight="700" class="sans">A. Năm lớp phòng thủ chống lệch dữ liệu (Zero-Drift)</text>
  <rect x="58.0" y="75.0" width="554.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="59.0" y="76.0" width="6" height="76.0" rx="3" fill="#4AA3D8"/>
  <text x="337.0" y="104.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Lớp 1: Fetch-Latest-State</text>
  <text x="337.0" y="127.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">Outbox gửi ListingId → Consumer luôn đọc bản ghi SQL mới nhất</text>
  <polyline points="335.0,153.0 335.0,187.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <rect x="58.0" y="187.0" width="554.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="59.0" y="188.0" width="6" height="76.0" rx="3" fill="#F27D32"/>
  <text x="337.0" y="216.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Lớp 2: Sequential Partitioning</text>
  <text x="337.0" y="239.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">Băm Hash(ListingId) mod P → Sự kiện cùng 1 tin chạy tuần tự</text>
  <polyline points="335.0,265.0 335.0,299.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <rect x="58.0" y="299.0" width="554.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="59.0" y="300.0" width="6" height="76.0" rx="3" fill="#54B56C"/>
  <text x="337.0" y="328.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Lớp 3: Query-Time Guard</text>
  <text x="337.0" y="351.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">Mọi truy vấn bắt buộc filter: t<tspan baseline-shift="sub" font-size="74%">end</tspan> &gt; t<tspan baseline-shift="sub" font-size="74%">now</tspan> (chính xác từng giây)</text>
  <polyline points="335.0,377.0 335.0,411.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <rect x="58.0" y="411.0" width="554.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="59.0" y="412.0" width="6" height="76.0" rx="3" fill="#F2CA4E"/>
  <text x="337.0" y="440.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Lớp 4: Cron 00:00:05 (+07:00)</text>
  <text x="337.0" y="463.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">Hạ VIP → Standard đúng giao ngày + API tự chuẩn hóa badge</text>
  <polyline points="335.0,489.0 335.0,523.0" fill="none" stroke="#64748B" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <rect x="58.0" y="523.0" width="554.0" height="78.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="59.0" y="524.0" width="6" height="76.0" rx="3" fill="#64748B"/>
  <text x="337.0" y="552.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Lớp 5: Reconciliation 15 phút</text>
  <text x="337.0" y="575.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">So khớp tập (ID, updatedAt) SQL ⊖ Meili → Xóa thừa &amp; Nạp bù</text>
  <rect x="678.0" y="36.0" width="654.0" height="628.0" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.6"/>
  <rect x="694.0" y="24.0" width="370.0" height="24" rx="4" fill="#FFFFFF" stroke="#54B56C" stroke-width="1.6"/>
  <text x="879.0" y="40.5" text-anchor="middle" fill="#54B56C" font-size="12" font-weight="700" class="sans">B. Lưu đồ quyết định đồng bộ (13 biến cố vòng đời)</text>
  <polygon points="847.0,78.0 1191.0,78.0 1163.0,130.0 819.0,130.0" fill="#EFF8FD" stroke="#111827" stroke-width="1.9" stroke-linejoin="round"/>
  <text x="1005.0" y="100.0" text-anchor="middle" fill="#111827" font-size="12.2" font-weight="700" class="sans">Nhận sự kiện Domain (ListingId)</text>
  <text x="1005.0" y="116.0" text-anchor="middle" fill="#111827" font-size="12.2" font-weight="700" class="sans">từ RabbitMQ Partition Queue</text>
  <rect x="825.0" y="173.0" width="360.0" height="66.0" rx="7" fill="#FFFFFF" stroke="#111827" stroke-width="1.9"/>
  <rect x="826.0" y="174.0" width="6" height="64.0" rx="3" fill="#4AA3D8"/>
  <text x="1007.0" y="196.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">Đọc trạng thái hiện hành từ SQL</text>
  <text x="1007.0" y="219.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">L ← SELECT Listing + CoverImage (NoTracking)</text>
  <polygon points="1005.0,281.0 1179.0,342.0 1005.0,403.0 831.0,342.0" fill="#FEFBE8" stroke="#111827" stroke-width="2.0" stroke-linejoin="round"/>
  <text x="1005.0" y="330.0" text-anchor="middle" fill="#111827" font-size="13" font-weight="500" class="math">Status = Published  ∧</text>
  <text x="1005.0" y="346.0" text-anchor="middle" fill="#111827" font-size="13" font-weight="500" class="math">Decision = Approved  ∧</text>
  <text x="1005.0" y="362.0" text-anchor="middle" fill="#111827" font-size="13" font-weight="500" class="math">t<tspan baseline-shift="sub" font-size="74%">end</tspan> &gt; t<tspan baseline-shift="sub" font-size="74%">now</tspan> ?</text>
  <rect x="695.0" y="482.0" width="286.0" height="148.0" rx="7" fill="#EFFAF2" stroke="#54B56C" stroke-width="1.9"/>
  <text x="838.0" y="526.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">UPSERT Document (~4 ms)</text>
  <line x1="709.0" y1="540.5" x2="967.0" y2="540.5" stroke="#CBD5E1" stroke-width="1"/>
  <text x="838.0" y="557.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">1. Duyệt sửa còn hạn · 2. Unhide</text>
  <text x="838.0" y="575.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">3. Mua / Gia hạn VIP · 4. Hạ VIP</text>
  <text x="838.0" y="593.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">5. Đổi ảnh bìa · 6. Đẩy tin (Bump)</text>
  <rect x="1029.0" y="482.0" width="286.0" height="148.0" rx="7" fill="#FEF2F2" stroke="#DC5656" stroke-width="1.9"/>
  <text x="1172.0" y="526.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">DELETE Document</text>
  <line x1="1043.0" y1="540.5" x2="1301.0" y2="540.5" stroke="#CBD5E1" stroke-width="1"/>
  <text x="1172.0" y="557.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">7. Tạo nháp · 8. Gửi duyệt · 9. Sửa tin</text>
  <text x="1172.0" y="575.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">10. Chờ thanh toán · 11. Từ chối</text>
  <text x="1172.0" y="593.5" text-anchor="middle" fill="#1F2937" font-size="11.8" font-weight="500" class="sans">12. Ẩn / Xóa · 13. Hết hạn hiển thị</text>
  <polyline points="1005.0,130.0 1005.0,173.0" fill="none" stroke="#111827" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <polyline points="1005.0,239.0 1005.0,281.0" fill="none" stroke="#111827" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-ink)"/>
  <polyline points="900.0,376.0 838.0,376.0 838.0,482.0" fill="none" stroke="#54B56C" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-green)"/>
  <rect x="744.0" y="419.8" width="112.0" height="18.5" rx="3" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="800.0" y="433.9" text-anchor="middle" fill="#54B56C" font-size="11.5" font-weight="700" class="sans">Đúng (Hiển thị)</text>
  <polyline points="1110.0,376.0 1172.0,376.0 1172.0,482.0" fill="none" stroke="#DC5656" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-red)"/>
  <rect x="1168.6" y="419.8" width="98.7" height="18.5" rx="3" fill="#FFFFFF" fill-opacity="0.94"/>
  <text x="1218.0" y="433.9" text-anchor="middle" fill="#DC5656" font-size="11.5" font-weight="700" class="sans">Sai (Ẩn ngay)</text>
  <polyline points="612.0,226.0 656.0,226.0 656.0,104.0 833.0,104.0" fill="none" stroke="#F27D32" stroke-width="2.0" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#ah-orange)"/>
</svg>