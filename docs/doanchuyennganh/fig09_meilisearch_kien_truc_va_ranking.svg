  <text x="1110.0" y="618.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">w<tspan baseline-shift="sub" font-size="74%">tier</tspan>(VIP) = 200  &gt;  w<tspan baseline-shift="sub" font-size="74%">tier</tspan>(Standard) = 100</text>
