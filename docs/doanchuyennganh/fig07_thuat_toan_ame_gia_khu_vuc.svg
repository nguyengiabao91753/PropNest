  <text x="994.0" y="98.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">1. Chuẩn hóa đơn giá mỗi mét vuông (VNĐ/m²)</text>
  <text x="994.0" y="121.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">p<tspan baseline-shift="sub" font-size="74%">i</tspan> = P<tspan baseline-shift="sub" font-size="74%">i</tspan> / A<tspan baseline-shift="sub" font-size="74%">i</tspan>    (A<tspan baseline-shift="sub" font-size="74%">i</tspan> &gt; 0,  i = 1, ..., n)</text>
  <rect x="732.0" y="175.0" width="520.0" height="74.0" rx="7" fill="#F8FAFC" stroke="#111827" stroke-width="1.9"/>
  <rect x="733.0" y="176.0" width="6" height="72.0" rx="3" fill="#4AA3D8"/>
  <text x="994.0" y="202.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">2. Loại bỏ ngoại lai bằng phân vị cắt (Trimmed IQR 15%–85%)</text>
  <text x="994.0" y="225.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">S&#x27; = { p<tspan baseline-shift="sub" font-size="74%">i</tspan> ∈ S  |  Q<tspan baseline-shift="sub" font-size="74%">0.15</tspan>(S) ≤ p<tspan baseline-shift="sub" font-size="74%">i</tspan> ≤ Q<tspan baseline-shift="sub" font-size="74%">0.85</tspan>(S) }</text>
  <rect x="732.0" y="283.0" width="520.0" height="78.0" rx="7" fill="#EFF8FD" stroke="#4AA3D8" stroke-width="1.9"/>
  <rect x="733.0" y="284.0" width="6" height="76.0" rx="3" fill="#F27D32"/>
  <text x="994.0" y="312.5" text-anchor="middle" fill="#111827" font-size="12.5" font-weight="700" class="sans">3. Tính giá trung bình chuẩn μ &amp; Độ lệch tương đối δ</text>
  <text x="994.0" y="335.5" text-anchor="middle" fill="#1F2937" font-size="12.8" font-weight="500" class="math">μ = (1 / |S&#x27;|) · Σ p<tspan baseline-shift="sub" font-size="74%">i</tspan>     |     δ = |p<tspan baseline-shift="sub" font-size="74%">u</tspan> − μ| / μ</text>
