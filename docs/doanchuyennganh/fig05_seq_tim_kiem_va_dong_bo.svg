  <rect x="42" y="546.0" width="452.2" height="19" rx="2" fill="#FFFFFF"/>
  <text x="48.0" y="559.0" text-anchor="start" fill="#64748B" font-size="11.5" font-weight="700" class="sans">[Quartz 00:00:05 (+07) Hạ VIP &amp; Đối soát tự chữa lành mỗi 15 phút]</text>
  <line x1="919.0" y1="596.0" x2="667.0" y2="596.0" stroke="#111827" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <rect x="645.3" y="574.0" width="295.4" height="19" rx="2" fill="#FFFFFF"/>
  <text x="793.0" y="587.5" text-anchor="middle" fill="#111827" font-size="11.8" font-weight="500" class="sans">7. Đọc tập ID Published còn hạn từ SQL Server</text>
