  <text x="793.0" y="415.5" text-anchor="middle" fill="#111827" font-size="11.8" font-weight="500" class="sans">4. Outbox → RabbitMQ (Partition theo ListingId)</text>
  <line x1="919.0" y1="470.0" x2="667.0" y2="470.0" stroke="#111827" stroke-width="1.8" marker-end="url(#ah-ink)"/>
  <rect x="620.3" y="448.0" width="345.5" height="19" rx="2" fill="#FFFFFF"/>
  <text x="793.0" y="461.5" text-anchor="middle" fill="#111827" font-size="11.8" font-weight="500" class="sans">5. Fetch trạng thái MỚI NHẤT của Listing + CoverImage</text>
  <line x1="933.0" y1="516.0" x2="1185.0" y2="516.0" stroke="#54B56C" stroke-width="1.8" marker-end="url(#ah-green)"/>
  <rect x="867.5" y="494.0" width="383.0" height="19" rx="2" fill="#FFFFFF"/>
  <text x="1059.0" y="507.5" text-anchor="middle" fill="#54B56C" font-size="11.8" font-weight="500" class="sans">6. Published ∧ Còn hạn → UPSERT (~4ms) | Ngược lại → DELETE</text>
