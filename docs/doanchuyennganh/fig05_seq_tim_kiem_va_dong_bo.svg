  <rect x="842.5" y="614.0" width="433.0" height="19" rx="2" fill="#FFFFFF"/>
  <text x="1059.0" y="627.5" text-anchor="middle" fill="#4AA3D8" font-size="11.8" font-weight="500" class="sans">8. Xóa ID thừa (Orphan) &amp; Upsert bù ID thiếu/lệch → Zero-Drift 100%</text>
